
[project]
name = "epita-sheshank-boddu-devopsnetops"
version = "0.1.0"
description = "EPITA Group 3 DevOps and NetOps GitHub REST API CLI"
readme = "README.md"
authors = [
    { name = "Sheshank Boddu", email = "sri9848d@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
epita-group3-cli = "epita_sheshank_boddu_devopsnetops.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "twine>=7.0.0",
]
